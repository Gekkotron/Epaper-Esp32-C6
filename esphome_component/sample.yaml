esphome:
  name: esphome-web-2d15e4
  friendly_name: ESPHome Web 2d15e4
  min_version: 2025.11.0
  name_add_mac_suffix: false

esp32:
  variant: esp32c6
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: components
    components: [epaper_rwb]

spi:
  clk_pin: GPIO19
  mosi_pin: GPIO18

color:
  - id: red
    red: 100%
    green: 0%
    blue: 0%

display:
  - platform: epaper_rwb
    id: my_epaper
    cs_pin: GPIO20
    dc_pin: GPIO0
    reset_pin: GPIO1
    busy_pin: GPIO2
    power_pin:
      number: GPIO14
      inverted: true
    update_interval: 60s
    lambda: |-
      // Affiche l'heure avec secondes, centrée
      auto now = id(sntp_time).now();
      if (now.is_valid()) {
        it.printf(76, 80, id(roboto_32), COLOR_ON, TextAlign::CENTER, "%02d:%02d",
                  now.hour, now.minute);
      } else {
        it.print(76, 80, id(roboto_16), COLOR_ON, TextAlign::CENTER, "Waiting...");
      }

      it.image(40, 170, id(heart), id(red), COLOR_OFF);

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Paris

image:
  - file: mdi:heart
    id: heart
    type: grayscale
    transparency: alpha_channel
    resize: 80x80

font:
  - file: "gfonts://Roboto@700"
    id: roboto_32
    size: 32

  - file: "gfonts://Roboto"
    id: roboto_16
    size: 16